spring:
  profiles:
    # Domyślnie używamy profilu json (bez bazy danych)
    # Zmień na jdbc lub jpa ustawiając zmienną środowiskową APP_PROFILE
    active: ${APP_PROFILE:json}
  main:
    banner-mode: off

server:
  port: 8080

# Ścieżki do plików JSON używane przez profil json
carrent:
  json:
    users-file: users.json
    vehicles-file: vehicles.json
    rentals-file: rentals.json
    categories-file: categories.json
